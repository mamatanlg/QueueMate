$kind: http-request
name: 'Login – Incorrect Password'
method: POST
url: '{{base_url}}/api/v1/auth/login'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "cashier1",
      "password": "wrong_password_intentional"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 401 Unauthorized for incorrect password", function () {
          pm.response.to.have.status(401);
      });

      pm.test("Response body indicates authentication failure", function () {
          const json = pm.response.json();
          pm.expect(json).to.not.have.property("accessToken");
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
