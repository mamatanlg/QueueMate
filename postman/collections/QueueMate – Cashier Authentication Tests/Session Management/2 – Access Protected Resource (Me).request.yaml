$kind: http-request
name: '2 – Access Protected Resource (Me)'
method: GET
url: '{{base_url}}/api/v1/cashier/me'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK with valid token", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });

      pm.test("Response contains cashier identity fields", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("number");
          pm.expect(json).to.have.property("name");
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
