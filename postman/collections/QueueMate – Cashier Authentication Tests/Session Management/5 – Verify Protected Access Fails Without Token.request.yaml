$kind: http-request
name: '5 – Verify Protected Access Fails Without Token'
method: GET
url: '{{base_url}}/api/v1/cashier/me'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 401 Unauthorized when no token is provided", function () {
          pm.response.to.have.status(401);
      });

      pm.test("Response does not contain protected cashier data", function () {
          const json = pm.response.json();
          pm.expect(json).to.not.have.property("number");
          pm.expect(json).to.not.have.property("name");
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
