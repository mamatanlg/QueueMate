$kind: http-request
name: 'Login Cashier 1 – Window 1'
method: POST
url: '{{base_url}}/api/v1/auth/login'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "cashier1",
      "password": "{{password}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // 429 guard: skip this login if a previous request already hit the rate limit.
      if (pm.collectionVariables.get("rate_limited") === "true") {
          pm.execution.skipRequest();
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response contains accessToken", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("accessToken");
          pm.expect(json.accessToken).to.be.a("string").and.not.empty;
      });

      // Store JWT in collection variable only – never logged or printed.
      if (pm.response.code === 200) {
          const json = pm.response.json();
          pm.collectionVariables.set("token", json.accessToken);
      }

      pm.test("Content-Type is application/json", function () {
          pm.response.to.have.header("Content-Type");
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
